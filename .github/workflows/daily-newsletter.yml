name: Daily Financial Adviser Brief

on:
  schedule:
    - cron: "45 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-newsletter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser==6.0.14 requests==2.34.2 PyYAML==6.0.3

      - name: Run newsletter pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python scripts/run_newsletter.py

      - name: Publish generated newsletter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/archive/
          git diff --cached --quiet || git commit -m "Publish daily newsletter"
          git push
